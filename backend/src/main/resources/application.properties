spring.application.name=FileVault
server.port=${PORT:8080}

# Database Configuration
# Defaults to a local H2 database so the application can boot without external services.
# Override these values with MySQL environment variables in deployment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/filevault_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA/Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.h2.console.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.filevault=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# JWT Configuration  
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-environment-with-random-string-atleast-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=uploads

# Application Configuration
app.name=FileVault
app.version=1.0.0

